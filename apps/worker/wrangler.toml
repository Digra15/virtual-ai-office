# Cloudflare Workers backend for Virtual AI Office.
# The Durable Object `AgentRoom` owns ALL agent state (registry + WebSocket
# clients + demo simulator). The Worker itself is a thin router/CORS layer.
#
# Deploy: `npx wrangler deploy` (run `npx wrangler login` first), or connect
# the GitHub repo in the Workers dashboard — it reads this file automatically.

name = "virtual-ai-office-api"
main = "src/index.ts"
compatibility_date = "2026-10-22"

[[durable_objects.bindings]]
name = "AGENT_ROOM"
class_name = "AgentRoom"

[[migrations]]
tag = "v1"
# NOTE: free-plan accounts REQUIRE new_sqlite_classes (error 10097 otherwise)
new_sqlite_classes = ["AgentRoom"]

# ---------------------------------------------------------------------------
# Admin panel bindings — D1 ONLY since 2026-10-26 (user decision: no R2,
# because enabling R2 asks for a payment method). D1 IS SQLite at the
# edge, and it backs everything except character-file uploads: admin
# users, sessions, workers, services, orders, office config, audit log.
# Asset upload/delete answers 503 without the bucket — that is expected,
# not an error. To re-enable uploads later: enable R2 in the dashboard,
# create bucket vao-assets, uncomment the block below, redeploy.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "vao-admin"
database_id = "5e176465-5858-4a78-a5a1-0060643012a3"

# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "vao-assets"
#
# Secrets (NEVER commit real values — set via CLI or dashboard):
#   npx wrangler secret put AGENT_SECRET     # required: agent event + task auth
#   npx wrangler secret put SETUP_TOKEN     # admin first-run setup
#   npx wrangler secret put INTERNAL_SECRET # admin live-update channel
#   npx wrangler secret put RECEPTIONIST_API_KEY # AI receptionist endpoint key (optional)
# ---------------------------------------------------------------------------
# AI receptionist (ANOTHER AI via an owner-supplied endpoint — not the
# poller agent, not Workers AI). Inert until the owner sets the URL:
#   RECEPTIONIST_API_URL = "https://example.com/v1/chat/completions"  # [vars]
#   npx wrangler secret put RECEPTIONIST_API_KEY                     # if needed
# RECEPTIONIST_API_FORMAT = "openai" is the v1 default; any other value
# disables the adapter. RECEPTIONIST_MODEL is optional (sent only if set).
# ---------------------------------------------------------------------------

[vars]
# "false" = NO demo, ever. Only the 3 live seats (difia, kirana, reno) exist;
# demo agents persisted from an earlier deployment are purged on boot.
# "true" restores the old clearly-labeled demo simulator (8 demo agents).
DEMO_MODE = "false"
# Live agents silent longer than this (ms) are marked offline.
# 600000 (10 min) so the 5-minute poller keeps all 3 live seats visibly
# online even if one poll run fails; a genuinely silent seat still flips
# to offline within 10 minutes. Previously 30000, which made poller-kept
# seats flicker offline between polls.
OFFLINE_TIMEOUT_MS = "600000"
# Max POST /api/agents/:id/events requests per IP per minute.
RATE_LIMIT_PER_MINUTE = "60"
# Public base URL of the vao-assets R2 bucket, e.g.
# "https://pub-xxxx.r2.dev" or "https://assets.example.com".
# Character-model URLs are built as <base>/characters/<id>.glb.
# Leave commented out if the bucket is not publicly reachable — uploads still
# work, but the API returns the R2 key with publicUrlConfigured:false.
# R2_PUBLIC_BASE_URL = "https://pub-REPLACE_ME.r2.dev"
# Exact origin of the admin UI (Cloudflare Pages URL). Enables credentialed
# CORS so the browser sends the HttpOnly session cookie cross-site.
# (or `npx wrangler secret put ADMIN_ORIGIN`). Without it, admin login from a
# browser on a different origin will not work.
ADMIN_ORIGIN = "https://virtual-ai-office.pages.dev"
# AI receptionist wire format (v1: only "openai" is supported; any other
# value makes the adapter inert). The endpoint URL itself is intentionally
# NOT set here — until the owner supplies it, the integration stays inert
# and the poller answers guest messages as before.
RECEPTIONIST_API_FORMAT = "openai"
